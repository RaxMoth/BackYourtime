name: CI

# Runs static analysis and the unit-test suite on every push to main and on
# every pull request targeting main. A broken `flutter analyze` or a failing
# `flutter test` fails the check, blocking the merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for a ref when a newer commit is pushed to it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
